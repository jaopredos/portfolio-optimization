[project]
name = "portfolio-opt"
version = "0.1.0"
description = "Otimização de portfólio Markowitz+ESG (INF0415/UFG) — Checkpoint 1: DE via pymoo, baseline exato via cvxpy"
requires-python = ">=3.11"
dependencies = [
    "cvxpy>=1.9.2",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pymoo>=0.6.1.6",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "yfinance>=1.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
